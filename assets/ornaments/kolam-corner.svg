    <path d="M5 52C5 25 25 5 52 5" stroke-width="1.1"/>
    <path d="M15 52C15 31 31 15 52 15" stroke-width="0.9" opacity=".65"/>
    <circle cx="10.4" cy="40" r="4.2" stroke-width="0.9"/>
    <circle cx="19.2" cy="19.2" r="4.6" stroke-width="0.9"/>
    <circle cx="40" cy="10.4" r="4.2" stroke-width="0.9"/>
  </g>
  <g fill="#B08A45">
    <circle cx="10.4" cy="40" r="1.6"/>
    <circle cx="19.2" cy="19.2" r="1.8"/>
    <circle cx="40" cy="10.4" r="1.6"/>
    <circle cx="9" cy="52" r="1.3"/>
    <circle cx="52" cy="9" r="1.3"/>
    <circle cx="28.5" cy="28.5" r="1.1" opacity=".7"/>
  </g>
</svg>
