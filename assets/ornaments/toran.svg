<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 78" width="120" height="78">
  <!-- Thoranam tile: brass cord, marigolds at the knots, mango leaves hanging from each swag. Repeats horizontally. -->
  <defs>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AA552"/>
      <stop offset="1" stop-color="#4A6829"/>
    </linearGradient>
    <radialGradient id="mg" cx=".42" cy=".38" r=".65">
      <stop offset="0" stop-color="#F8C553"/>
      <stop offset="1" stop-color="#D9741A"/>
    </radialGradient>
    <g id="leaf">
      <path d="M0 0C-8 12-7.5 31 0 48C7.5 31 8 12 0 0Z" fill="url(#lf)"/>
      <path d="M0 3V44" stroke="#34491D" stroke-width=".8" opacity=".55"/>
    </g>
    <g id="flower">
      <circle r="7.6" fill="url(#mg)"/>
      <g fill="#E4881F">
        <circle cx="0" cy="-5.3" r="2.7"/>
        <circle cx="3.75" cy="-3.75" r="2.7"/>
        <circle cx="5.3" cy="0" r="2.7"/>
        <circle cx="3.75" cy="3.75" r="2.7"/>
        <circle cx="0" cy="5.3" r="2.7"/>
        <circle cx="-3.75" cy="3.75" r="2.7"/>
        <circle cx="-5.3" cy="0" r="2.7"/>
        <circle cx="-3.75" cy="-3.75" r="2.7"/>
      </g>
      <circle r="2.8" fill="#B4581A"/>
    </g>
  </defs>
  <path d="M0 9Q30 22 60 9Q90 22 120 9" fill="none" stroke="#B08A45" stroke-width="1.5"/>
  <use href="#leaf" transform="translate(30 15.5) rotate(22) scale(.6)"/>
  <use href="#leaf" transform="translate(30 15.5) rotate(-22) scale(.6)"/>
  <use href="#leaf" transform="translate(30 15.5)"/>
  <use href="#leaf" transform="translate(90 15.5) rotate(22) scale(.6)"/>
  <use href="#leaf" transform="translate(90 15.5) rotate(-22) scale(.6)"/>
  <use href="#leaf" transform="translate(90 15.5)"/>
  <use href="#flower" transform="translate(0 9)"/>
  <use href="#flower" transform="translate(60 9)"/>
  <use href="#flower" transform="translate(120 9)"/>
</svg>
